[project]
name = "sqtop"
version = "0.1.0"
description = "nvitop-style live view of your SLURM jobs (GPU, CPU, processes, logs), plus a JSON mode for agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8,<9"]

[project.scripts]
sqtop = "sqtop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# A monitor must survive one bad squeue / node / Prometheus call, so broad excepts and unchecked
# subprocess calls (return codes are inspected by hand) are deliberate. BINDINGS is Textual's idiom.
ignore = ["BLE001", "PLW1510", "RUF012"]
